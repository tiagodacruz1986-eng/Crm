# Mise en ligne en un clic sur Render (https://render.com) — voir README → « Installer sur téléphone » → 4.
# Render construit l'image Docker du logiciel et donne une adresse https://….onrender.com.
# Le disque « garage-data » garde les données (clients, factures, photos…) entre les redémarrages
# et les mises à jour : il demande une offre payante (l'offre gratuite efface tout à chaque redémarrage).
services:
  - type: web
    name: garage-manager
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /app-info.json
    disk:
      name: garage-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3000"
      # Serveur sur internet : code d'installation, limite des essais de mot de passe et PIN au kiosque toujours actifs
      - key: INTERNET_SERVER
        value: "1"
      - key: TZ
        value: Europe/Luxembourg
      # Agents IA (facultatif) : après la création, ajoutez votre clé Claude dans l'onglet « Environment » du service
      # (variable ANTHROPIC_API_KEY). Elle n'est pas demandée ici pour que la mise en ligne ne soit jamais bloquée.
